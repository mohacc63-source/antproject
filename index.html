<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anthill Prints Co. — DTF & 3D Printing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #2EC4A5;
    --teal-dark: #1A9E89;
    --teal-light: #E6F8F4;
    --teal-mid: #A8E8DC;
    --black: #1A1A1A;
    --ink: #2D2D2D;
    --pink: #FF7CA3;
    --white: #FFFFFF;
    --cream: #F8FFFE;
    --card-shadow: 4px 4px 0px #1A9E89;
    --card-shadow-black: 4px 4px 0px #1A1A1A;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--cream);
    color: var(--ink);
    overflow-x: hidden;
  }

  /* ─── NAVBAR ─── */
  nav {
    position: sticky; top: 0; z-index: 1000;
    background: var(--black);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 5%;
    height: 70px;
    border-bottom: 3px solid var(--teal);
  }
  .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .nav-logo img { height: 50px; width: auto; max-width: 80px; object-fit: contain; }
  .nav-brand { font-family: 'Fredoka One', cursive; color: var(--teal); font-size: 1.4rem; letter-spacing: 0.5px; }
  .nav-links { display: flex; align-items: center; gap: 28px; }
  .nav-links a {
    color: #ccc; font-weight: 700; font-size: 0.95rem;
    text-decoration: none; letter-spacing: 0.3px;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--teal); }
  .cart-btn {
    position: relative; background: var(--teal);
    border: none; border-radius: 50px; padding: 8px 18px 8px 14px;
    cursor: pointer; display: flex; align-items: center; gap: 6px;
    font-family: 'Nunito', sans-serif; font-weight: 800;
    font-size: 0.95rem; color: var(--black);
    transition: transform 0.15s, background 0.2s;
  }
  .cart-btn:hover { background: var(--teal-dark); transform: translateY(-2px); }
  .cart-icon { font-size: 1.2rem; }
  .cart-count {
    background: var(--pink); color: white;
    border-radius: 50%; width: 20px; height: 20px;
    font-size: 0.75rem; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    position: absolute; top: -6px; right: -6px;
  }
  .hamburger { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 4px; }
  .hamburger span { display: block; width: 24px; height: 2.5px; background: var(--teal); border-radius: 2px; transition: all 0.3s; }

  /* ─── HERO ─── */
  .hero {
    min-height: calc(100vh - 70px);
    display: flex; align-items: center;
    background: var(--black);
    padding: 60px 5%;
    position: relative; overflow: hidden;
  }
  .hero-bg-dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, var(--teal) 1px, transparent 1px);
    background-size: 36px 36px; opacity: 0.07;
  }
  .hero-content { max-width: 560px; position: relative; z-index: 2; }
  .hero-badge {
    display: inline-block; background: var(--teal); color: var(--black);
    font-weight: 800; font-size: 0.8rem; letter-spacing: 1.5px;
    padding: 5px 14px; border-radius: 50px; margin-bottom: 20px;
    text-transform: uppercase;
  }
  .hero h1 {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2.8rem, 6vw, 4.5rem);
    color: white; line-height: 1.05;
    margin-bottom: 10px;
  }
  .hero h1 span { color: var(--teal); }
  .hero-sub {
    color: #aaa; font-size: 1.1rem; line-height: 1.7;
    margin-bottom: 36px; font-weight: 600;
  }
  .hero-sub strong { color: var(--teal-mid); }
  .hero-ctas { display: flex; gap: 14px; flex-wrap: wrap; }
  .btn-primary {
    background: var(--teal); color: var(--black);
    font-family: 'Nunito', sans-serif; font-weight: 800;
    font-size: 1rem; padding: 14px 28px;
    border: 3px solid var(--teal); border-radius: 50px;
    cursor: pointer; text-decoration: none;
    transition: transform 0.15s, box-shadow 0.15s;
    display: inline-block;
    box-shadow: 4px 4px 0 var(--teal-dark);
  }
  .btn-primary:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--teal-dark); }
  .btn-outline {
    background: transparent; color: white;
    font-family: 'Nunito', sans-serif; font-weight: 800;
    font-size: 1rem; padding: 14px 28px;
    border: 3px solid rgba(255,255,255,0.3); border-radius: 50px;
    cursor: pointer; text-decoration: none;
    transition: all 0.2s;
    display: inline-block;
  }
  .btn-outline:hover { border-color: var(--teal); color: var(--teal); }
  .hero-mascot {
    position: absolute; right: 5%; bottom: 0; z-index: 2;
    width: clamp(260px, 35vw, 500px);
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0px); }
    50% { transform: translateY(-18px); }
  }
  .hero-stats {
    display: flex; gap: 32px; margin-top: 40px; flex-wrap: wrap;
  }
  .hero-stat strong { display: block; font-family: 'Fredoka One', cursive; color: var(--teal); font-size: 1.8rem; }
  .hero-stat span { color: #888; font-size: 0.85rem; font-weight: 600; }

  /* ─── SECTION SHARED ─── */
  section { padding: 80px 5%; }
  .section-tag {
    display: inline-block; background: var(--teal-light);
    color: var(--teal-dark); font-weight: 800; font-size: 0.8rem;
    letter-spacing: 1.5px; text-transform: uppercase;
    padding: 5px 14px; border-radius: 50px; margin-bottom: 12px;
    border: 2px solid var(--teal-mid);
  }
  .section-title {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2rem, 4vw, 3rem); color: var(--black); margin-bottom: 10px;
  }
  .section-sub { color: #666; font-size: 1rem; max-width: 520px; line-height: 1.7; font-weight: 600; margin-bottom: 48px; }

  /* ─── SERVICES STRIP ─── */
  .services-strip {
    background: var(--teal);
